<script>

function login() {

  console.log("LOGIN ATTEMPT");

  // =========================================
  // GET LOGIN VALUES
  // =========================================

  const usernameInput =
    document.getElementById("username");

  const passwordInput =
    document.getElementById("password");

  const username =
    usernameInput ? usernameInput.value.trim() : "";

  const password =
    passwordInput ? passwordInput.value : "";


  // =========================================
  // BASIC VALIDATION
  // =========================================

  if (!username || !password) {

    alert("Please enter your username and password.");

    return;
  }


  // =========================================
  // DISABLE LOGIN BUTTON
  // =========================================

  const loginBtn =
    document.querySelector(".login-button");

  if (loginBtn) {

    loginBtn.disabled = true;

    loginBtn.innerHTML =
      '<span class="material-icons-outlined">hourglass_empty</span> Logging in...';
  }


  // =========================================
  // AUTHENTICATE WITH GOOGLE APPS SCRIPT
  // =========================================

  google.script.run

    .withSuccessHandler(function(result) {

      console.log("AUTHENTICATION RESULT:", result);


      // =======================================
      // LOGIN FAILED
      // =======================================

      if (!result || !result.success) {

        alert(
          result && result.message
            ? result.message
            : "Invalid username or password."
        );


        // Restore button

        if (loginBtn) {

          loginBtn.disabled = false;

          loginBtn.innerHTML =
            '<span class="material-icons-outlined">login</span> Login';
        }

        return;
      }


      // =======================================
      // LOGIN SUCCESSFUL
      // =======================================

      console.log("IT LOGIN SUCCESSFUL");

      console.log(
        "Logged in user:",
        result.fullName
      );


      // =======================================
      // SAVE LOGGED-IN USER
      // =======================================

      window.currentITUser = result;


      // =======================================
      // HIDE LOGIN SCREEN
      // =======================================

      const loginContainer =
        document.getElementById("login-container");

      if (loginContainer) {

        loginContainer.style.display = "none";
      }


      // =======================================
      // HIDE PUBLIC LOGIN BUTTON
      // =======================================

      const loginButton =
        document.getElementById("itLoginButton");

      if (loginButton) {

        loginButton.style.display = "none";
      }


      // =======================================
      // SHOW IT SIDEBAR
      // =======================================

      const sidebar =
        document.getElementById("it-sidebar");

      if (sidebar) {

        sidebar.style.display = "block";
      }


      // =======================================
      // SHOW IT TOPBAR
      // =======================================

      const topbar =
        document.getElementById("it-topbar");

      if (topbar) {

        topbar.style.display = "block";
      }


      // =======================================
      // SHOW IT APPLICATION
      // =======================================

      const appLayout =
        document.getElementById("app-layout");

      if (appLayout) {

        appLayout.style.display = "flex";
      }


      // =======================================
      // UPDATE TOPBAR USER
      // =======================================

      const userName =
        document.getElementById("topbarUserName");

      const userPosition =
        document.getElementById("topbarUserPosition");

      if (userName) {

        userName.textContent =
          result.fullName;
      }

      if (userPosition) {

        userPosition.textContent =
          result.position;
      }

      const profileMenuName =
        document.getElementById("profileMenuName");

      const profileMenuPosition =
        document.getElementById("profileMenuPosition");

      if (profileMenuName) {
        profileMenuName.textContent =
          result.fullName;
      }

      if (profileMenuPosition) {
        profileMenuPosition.textContent =
          result.position;
      }


      // =======================================
      // LOAD DASHBOARD
      // =======================================

      loadDashboard();


      // =======================================
      // RETURN TO TOP
      // =======================================

      window.scrollTo({
        top: 0,
        left: 0,
        behavior: "instant"
      });

    })


    // =========================================
    // SERVER ERROR
    // =========================================

    .withFailureHandler(function(error) {

      console.error(
        "LOGIN ERROR:",
        error
      );

      alert(
        "Unable to connect to the authentication system."
      );


      // Restore button

      if (loginBtn) {

        loginBtn.disabled = false;

        loginBtn.innerHTML =
          '<span class="material-icons-outlined">login</span> Login';
      }

    })


    .authenticateUser(
      username,
      password
    );

}

    document.getElementById("userProfileMenu");

  if (!menu) return;

  menu.classList.toggle("show");

}


// =========================================

document.addEventListener("click", function(event) {

  const wrapper =
    document.querySelector(".user-profile-wrapper");

  const menu =
    document.getElementById("userProfileMenu");

  if (!wrapper || !menu) return;

  if (!wrapper.contains(event.target)) {

    menu.classList.remove("show");

  }

});

function showPage(page) {

  const dashboard =
    document.getElementById("dashboard-page");

  const inventory =
    document.getElementById("inventory-page");

  const transactions =
    document.getElementById("transaction-history-page");


  // Hide everything

  if (dashboard) {
    dashboard.style.display = "none";
  }

  if (inventory) {
    inventory.style.display = "none";
  }

  if (transactions) {
    transactions.style.display = "none";
  }


  // Show requested page

  if (page === "dashboard" && dashboard) {

    dashboard.style.display = "block";

  }

  if (page === "inventory" && inventory) {

    inventory.style.display = "block";

  }

  if (
    page === "transactions" &&
    transactions
  ) {

    transactions.style.display = "block";

  }


  // Update sidebar active state

  document
    .querySelectorAll(".menu-item")
    .forEach(function(item) {

      item.classList.remove("active");

    });


  if (page === "dashboard") {

    document
      .getElementById("menuDashboard")
      ?.classList.add("active");

  }

  if (page === "inventory") {

    document
      .getElementById("menuInventory")
      ?.classList.add("active");

  }

  if (page === "transactions") {

    document
      .getElementById("menuTransactions")
      ?.classList.add("active");

  }

}

function loadDashboardStats() {

  console.log("Loading dashboard statistics...");

  google.script.run

    .withSuccessHandler(function(stats) {

      console.log("Dashboard stats received:", stats);

      if (!stats) {
        console.error("No dashboard statistics received.");
        return;
      }


      // ==========================================
      // TOTAL
      // ==========================================

      const total =
        document.getElementById("statTotal");

      if (total) {
        total.textContent = stats.total || 0;
      }


      // ==========================================
      // AVAILABLE
      // ==========================================

      const available =
        document.getElementById("statAvailable");

      if (available) {
        available.textContent =
          stats.available || 0;
      }


      // ==========================================
      // ISSUED / ASSIGNED
      // ==========================================

      const issued =
        document.getElementById("statIssued");

      if (issued) {
        issued.textContent =
          stats.issued || 0;
      }


      // ==========================================
      // BORROWED
      // ==========================================

      const borrowed =
        document.getElementById("statBorrowed");

      if (borrowed) {
        borrowed.textContent =
          stats.borrowed || 0;
      }


      // ==========================================
      // DAMAGED
      // ==========================================

      const damaged =
        document.getElementById("statDamaged");

      if (damaged) {
        damaged.textContent =
          stats.damaged || 0;
      }


      // ==========================================
      // UNDER REPAIR
      // ==========================================

      const repair =
        document.getElementById("statRepair");

      if (repair) {
        repair.textContent =
          stats.repair || 0;
      }


      // ==========================================
      // ISSUED TODAY
      // ==========================================

      const issuedToday =
        document.getElementById("statIssuedToday");

      if (issuedToday) {
        issuedToday.textContent =
          stats.issuedToday || 0;
      }


      // ==========================================
      // RETURNED TODAY
      // ==========================================

      const returnedToday =
        document.getElementById("statReturnedToday");

      if (returnedToday) {
        returnedToday.textContent =
          stats.returnedToday || 0;
      }


      console.log(
        "Dashboard statistics updated successfully."
      );

      loadInventoryStatusChart(stats);

    })

    .withFailureHandler(function(error) {

      console.error(
        "Dashboard statistics error:",
        error
      );

      alert(
        "Failed to load dashboard statistics: " +
        (error.message || error)
      );

    })

    .getDashboardStats();

}

function loadInventoryStatusChart(stats) {

  const canvas =
    document.getElementById(
      "inventoryStatusChart"
    );

  if (!canvas) {

    console.error(
      "inventoryStatusChart canvas not found."
    );

    return;

  }


  // ==========================================
  // DESTROY EXISTING CHART
  // ==========================================

  if (
    window.inventoryStatusChart &&
    typeof window.inventoryStatusChart.destroy === "function"
  ) {

    window.inventoryStatusChart.destroy();

  }


  // ==========================================
  // CREATE CHART
  // ==========================================

  const ctx =
    canvas.getContext("2d");


  window.inventoryStatusChart =
    new Chart(ctx, {

      type: "bar",

      data: {

        labels: [
          "Available",
          "Assigned",
          "Borrowed",
          "Damaged",
          "Under Repair",
          "Lost"
        ],

        datasets: [

          {

            label: "Headsets",

            data: [

              Number(stats.available || 0),

              Number(stats.issued || 0),

              Number(stats.borrowed || 0),

              Number(stats.damaged || 0),

              Number(stats.repair || 0),

              Number(stats.lost || 0)

            ],

            borderWidth: 1,

            borderRadius: 6

          }

        ]

      },


      options: {

        responsive: true,

        maintainAspectRatio: false,

        plugins: {

          legend: {

            display: false

          }

        },

        scales: {

          y: {

            beginAtZero: true,

            ticks: {

              precision: 0

            }

          }

        }

      }

    });

}

function loadRecentTransactions() {

  console.log(
    "Loading recent transactions..."
  );


  const tbody =
    document.getElementById(
      "recentTransactionsBody"
    );


  if (!tbody) {

    console.error(
      "recentTransactionsBody not found."
    );

    return;

  }


  // Show loading state

  tbody.innerHTML = `
    <tr>
      <td colspan="5" class="transactions-loading">
        Loading recent transactions...
      </td>
    </tr>
  `;


  google.script.run

    .withSuccessHandler(function(transactions) {

      console.log(
        "Recent transactions received:",
        transactions
      );


      tbody.innerHTML = "";


      // No transactions

      if (
        !transactions ||
        transactions.length === 0
      ) {

        tbody.innerHTML = `
          <tr>
            <td colspan="5" class="transactions-empty">
              No recent transactions found.
            </td>
          </tr>
        `;

        return;

      }


      transactions.forEach(function(transaction) {


        // =====================================
        // FORMAT DATE
        // =====================================

        let formattedDate = "-";


        if (transaction.date) {

          const date =
            new Date(transaction.date);


          if (!isNaN(date.getTime())) {

            formattedDate =
              date.toLocaleDateString(
                "en-US",
                {
                  month: "2-digit",
                  day: "2-digit",
                  year: "numeric"
                }
              );

          }

        }


        // =====================================
        // ACTION CLASS
        // =====================================

        let actionClass =
          "transaction-action";


        const action =
          (
            transaction.action || ""
          ).toLowerCase();


        if (action === "issued") {

          actionClass +=
            " transaction-issued";

        }
        else if (action === "borrowed") {

          actionClass +=
            " transaction-borrowed";

        }
        else if (action === "returned") {

          actionClass +=
            " transaction-returned";

        }


        // =====================================
        // ADD ROW
        // =====================================

        tbody.innerHTML += `

          <tr>

            <td>
              ${formattedDate}
            </td>


            <td>

              <span class="${actionClass}">
                ${transaction.action || "-"}
              </span>

            </td>


            <td>
              ${transaction.assetId || "-"}
            </td>


            <td>
              ${transaction.brand || "-"}
            </td>


            <td>
              ${transaction.employee || "-"}
            </td>

          </tr>

        `;

      });

    })


    .withFailureHandler(function(error) {

      console.error(
        "Recent transactions error:",
        error
      );


      tbody.innerHTML = `

        <tr>

          <td
            colspan="5"
            class="transactions-empty"
          >

            Unable to load recent transactions.

          </td>

        </tr>

      `;

    })


    .getRecentTransactions();

}

function loadInventory() {

  document.getElementById("dashboard-page").style.display = "none";
  document.getElementById("transaction-history-page").style.display = "none";
  document.getElementById("inventory-page").style.display = "block";

  document.getElementById("menuDashboard").classList.remove("active");
  document.getElementById("menuTransactions").classList.remove("active");
  document.getElementById("menuInventory").classList.add("active");

  loadInventoryData();

}


function loadDashboard() {

  document.getElementById("inventory-page").style.display = "none";
  document.getElementById("transaction-history-page").style.display = "none";
  document.getElementById("dashboard-page").style.display = "block";

  document.getElementById("menuInventory").classList.remove("active");
  document.getElementById("menuTransactions").classList.remove("active");
  document.getElementById("menuDashboard").classList.add("active");

  loadDashboardStats();
  loadRecentTransactions();

}

function loadInventoryData() {

  google.script.run
    .withSuccessHandler(function(data) {

      const tbody =
        document.querySelector("#inventoryTable tbody");

      tbody.innerHTML = "";

      data.forEach(function(item) {

        let statusClass = "";

        switch (
          (item.status || "").toLowerCase()
        ) {

          case "available":
            statusClass = "available";
            break;

          case "issued":
            statusClass = "issued";
            break;

          case "borrowed":
            statusClass = "borrowed";
            break;

          case "damaged":
            statusClass = "damaged";
            break;

          default:
            statusClass = "default";

        }


        // ==========================================
        // EAR BUTTON
        // ==========================================

        const isAssigned =
          (item.status || "")
            .toLowerCase()
            .trim() === "assigned";


        const earButton = isAssigned

          ? `
            <button
              class="btn-icon"
              onclick="generateEAR('${item.assetId}')"
              title="Generate EAR">

              <span class="material-icons-outlined">
                description
              </span>

            </button>
          `

          : "";


        // ==========================================
        // INVENTORY ROW
        // ==========================================

        tbody.innerHTML += `

          <tr>

            <td>
              ${item.assetId}
            </td>


            <td>
              ${item.brand}
            </td>


            <td>
              ${item.model}
            </td>


            <td>
              ${item.serialNumber}
            </td>


            <td>

              <span
                class="status-badge ${statusClass}">

                ${item.status || "-"}

              </span>

            </td>


            <td>
              ${item.condition || "-"}
            </td>


            <td>
              ${item.assignedTo || "-"}
            </td>


            <td
              style="text-align:center;">

              <!-- VIEW -->

              <button
                class="btn-icon"
                onclick="viewHeadset(this)"
                data-assetid="${item.assetId}"
                title="View Details">

                <span class="material-icons-outlined">
                  visibility
                </span>

              </button>


              <!-- EAR -->

              ${earButton}

            </td>

          </tr>

        `;

      });


      initializeInventoryPagination();

    })
    .withFailureHandler(function(error) {

      console.error(
        "Inventory loading error:",
        error
      );

      alert(
        error.message ||
        "Unable to load inventory."
      );

    })
    .getInventory();

}

function formatEARDate(dateValue) {

  if (!dateValue) {

    return "";

  }


  const date =
    new Date(dateValue);


  if (isNaN(date.getTime())) {

    return String(dateValue);

  }


  const month =
    String(
      date.getMonth() + 1
    ).padStart(2, "0");


  const day =
    String(
      date.getDate()
    ).padStart(2, "0");


  const year =
    date.getFullYear();


  return (
    month +
    "-" +
    day +
    "-" +
    year
  );

}

    assetId: document.getElementById("assetId").value,

function issueHeadset() {

  const btn = document.getElementById("btnIssueHeadset");

  btn.disabled = true;
  btn.textContent = "Issuing...";

  const issue = {

    agentName: document.getElementById("issueAgentName").value.trim(),
    assetId: document.getElementById("issueAssetId").value,

  };

  if (!issue.agentName) {
    alert("Please enter the Agent Name.");
    btn.disabled = false;
    btn.textContent = "Issue Headset";
    return;
  }

  if (!issue.assetId) {
    alert("Please select an Asset ID.");
    btn.disabled = false;
    btn.textContent = "Issue Headset";
    return;
  }

  if (!issue.issuedBy) {
    alert("Please enter who issued the headset.");
    btn.disabled = false;
    btn.textContent = "Issue Headset";
    return;
  }

  google.script.run
    .withSuccessHandler(function() {

      document.getElementById("issueAgentName").value = "";
      document.getElementById("issueAssetId").selectedIndex = 0;
      document.getElementById("issuedBy").value = "";

      closeIssueHeadsetModal();

      loadInventoryData();
      loadDashboardStats();

      btn.disabled = false;
      btn.textContent = "Issue Headset";

      alert("Headset issued successfully!");

    })
    .withFailureHandler(function(error) {

      btn.disabled = false;
      btn.textContent = "Issue Headset";

      console.error(error);
      alert("Error: " + error.message);

    })
    .issueHeadset(issue);

}

/**
 * Search a headset by Asset ID.
 *
 * Allowed current statuses:
 *
 * Assigned
 * Borrowed
 */
function searchReturnAsset() {

  const assetInput =
    document.getElementById(
      "returnAssetId"
    );


  const assetId =
    assetInput.value.trim();


  if (!assetId) {

    alert(
      "Please enter an Asset ID."
    );

    assetInput.focus();

    return;

  }


  // Clear old information

  document.getElementById(
    "returnAgentName"
  ).value = "";


  document.getElementById(
    "returnHeadsetBrand"
  ).value = "";


  document.getElementById(
    "returnCurrentStatus"
  ).value = "";


  google.script.run

    .withSuccessHandler(function(result) {

      if (!result) {

        alert(
          "No headset was found."
        );

        return;

      }


      if (!result.found) {

        alert(
          result.message ||
          "This headset cannot be returned."
        );

        return;

      }


      /*
       * Fill headset information
       */

      document.getElementById(
        "returnAssetId"
      ).value =
        result.assetId || assetId;


      document.getElementById(
        "returnAgentName"
      ).value =
        result.agentName || "";


      document.getElementById(
        "returnHeadsetBrand"
      ).value =
        result.brand || "";


      document.getElementById(
        "returnCurrentStatus"
      ).value =
        result.status || "";


    })

    .withFailureHandler(function(error) {

      console.error(
        "Return asset search error:",
        error
      );


      alert(
        error.message ||
        "Unable to search for the headset."
      );

    })

    .searchReturnableHeadset(assetId);

}

/**
 * Save Return transaction.
 */
function saveReturnHeadset() {

  const assetId =
    document.getElementById(
      "returnAssetId"
    ).value.trim();


  const agentName =
    document.getElementById(
      "returnAgentName"
    ).value.trim();


  const brand =
    document.getElementById(
      "returnHeadsetBrand"
    ).value.trim();


  const currentStatus =
    document.getElementById(
      "returnCurrentStatus"
    ).value.trim();


  const statusUponReturn =
    document.getElementById(
      "returnStatus"
    ).value;


  const checkedBy =
    document.getElementById(
      "returnCheckedBy"
    ).value.trim();


  const remarks =
    document.getElementById(
      "returnRemarks"
    ).value.trim();


  /*
   * =========================================
   * VALIDATION
   * =========================================
   */


  if (!assetId) {

    alert(
      "Please enter an Asset ID."
    );

    return;

  }


  if (!agentName) {

    alert(
      "Please search the Asset ID first."
    );

    return;

  }


  if (!brand) {

    alert(
      "Please search the Asset ID first."
    );

    return;

  }


  if (!currentStatus) {

    alert(
      "Please search the Asset ID first."
    );

    return;

  }


  if (
    currentStatus.toLowerCase() !== "assigned" &&
    currentStatus.toLowerCase() !== "borrowed"
  ) {

    alert(
      "Only Assigned or Borrowed headsets can be returned."
    );

    return;

  }


  if (!statusUponReturn) {

    alert(
      "Please select the Status Upon Return."
    );

    return;

  }


  if (!checkedBy) {

    alert(
      "Please enter Checked By."
    );

    return;

  }


  /*
   * =========================================
   * SAVE BUTTON
   * =========================================
   */

  const button =
    document.getElementById(
      "btnReturnHeadset"
    );


  button.disabled = true;


  button.innerHTML = `
    <span class="material-icons-outlined">
      hourglass_top
    </span>
    Saving...
  `;


  const data = {

    assetId:
      assetId,

    statusUponReturn:
      statusUponReturn,

    checkedBy:
      checkedBy,

    remarks:
      remarks

  };


  /*
   * =========================================
   * SEND TO APPS SCRIPT
   * =========================================
   */

  google.script.run

    .withSuccessHandler(function(result) {

      button.disabled = false;


      button.innerHTML = `
        Return Headset
      `;


      if (
        !result ||
        !result.success
      ) {

        alert(
          "Return transaction could not be saved."
        );

        return;

      }


      /*
       * Success
       */

      alert(
        "Headset returned successfully."
      );


      closeReturnHeadsetModal();


      /*
       * Refresh Inventory
       */

      if (
        typeof loadInventoryData ===
        "function"
      ) {

        loadInventoryData();

      }


      /*
       * Refresh Dashboard
       */

      if (
        typeof loadDashboardStats ===
        "function"
      ) {

        loadDashboardStats();

      }


      /*
       * Refresh Recent Transactions
       */

      if (
        typeof loadRecentTransactions ===
        "function"
      ) {

        loadRecentTransactions();

      }

    })


    .withFailureHandler(function(error) {

      console.error(
        "Return headset error:",
        error
      );


      button.disabled = false;


      button.innerHTML = `
        Return Headset
      `;


      alert(
        error.message ||
        "Unable to save return transaction."
      );

    })


    .returnHeadset(data);

}

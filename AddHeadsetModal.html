<div id="addHeadsetModal" class="modal" style="display:none;">

  <div class="modal-content">

    <div class="modal-header">

      <h2>Add Headset</h2>

      <button class="modal-close" onclick="closeAddHeadsetModal()">
        <span class="material-icons-outlined">close</span>
      </button>

    </div>

    <div class="modal-body">

      <div class="form-group">

        <label>Asset ID</label>

        <input
            type="text"
            id="assetId"
            readonly
            placeholder="Auto-generated">

      </div>

      <div class="form-row">

        <div class="form-group">

          <label>Brand</label>

          <input
            type="text"
            id="brand"
            placeholder="Enter Brand">

        </div>

        <div class="form-group">

          <label>Model</label>

          <input
            type="text"
            id="model"
            placeholder="Enter Model">

        </div>

      </div>

      <div class="form-group">

        <label>Serial Number</label>

        <input
          type="text"
          id="serialNumber"
          placeholder="Enter Serial Number">

      </div>

      <div class="form-row">

        <div class="form-group">

          <label>Purchase Date</label>

          <input
            type="date"
            id="purchaseDate">

        </div>

        <div class="form-group">

          <label>Purchase Price</label>

          <input
            type="number"
            id="purchasePrice"
            placeholder="0.00"
            min="0"
            step="0.01">

        </div>

        <div class="form-group">

          <label>Condition</label>

          <input
            type="text"
            id="condition"
            value="Brandnew"
            readonly>

        </div>

      </div>

    </div>

    <div class="modal-footer">

      <button class="btn-secondary" onclick="closeAddHeadsetModal()">
        Cancel
      </button>

      <button
        class="btn-primary"
        id="btnSaveHeadset"
        onclick="saveHeadset()">
        Save Headset
      </button>

    </div>

  </div>

</div>

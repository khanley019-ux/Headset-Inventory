
<div id="returnHeadsetModal" class="modal" style="display:none;">

  <div class="modal-content">

    <!-- =========================================
         HEADER
         ========================================= -->

    <div class="modal-header">

      <div>
        <h2>Return Headset</h2>
        <p class="modal-subtitle">
          Process a returned headset
        </p>
      </div>

      <button
        class="modal-close"
        onclick="closeReturnHeadsetModal()">

        <span class="material-icons-outlined">
          close
        </span>

      </button>

    </div>


    <!-- =========================================
         BODY
         ========================================= -->

    <div class="modal-body">

      <!-- ASSET ID -->

      <div class="form-group">

        <label for="returnAssetId">
          Asset ID
        </label>

        <div class="input-with-button">

          <input
            type="text"
            id="returnAssetId"
            placeholder="Enter Asset ID e.g. HS-0143"
            autocomplete="off">

          <button
            type="button"
            class="btn-icon"
            onclick="searchReturnHeadset()">

            <span class="material-icons-outlined">
              search
            </span>

          </button>

        </div>

      </div>


      <!-- AGENT NAME -->

      <div class="form-group">

        <label for="returnAgentName">
          Agent Name
        </label>

        <input
          type="text"
          id="returnAgentName"
          readonly
          placeholder="Automatically filled">

      </div>


      <!-- STATUS UPON RETURN -->

      <div class="form-group">

        <label for="returnStatus">
          Status Upon Return
        </label>

        <select id="returnStatus">

          <option value="">
            Select Status
          </option>

          <option value="Good">
            Good
          </option>

          <option value="New">
            New
          </option>

          <option value="Fair">
            Fair
          </option>

          <option value="Damaged">
            Damaged
          </option>

          <option value="Lost">
            Lost
          </option>

        </select>

      </div>


      <!-- REMARKS -->

      <div class="form-group">

        <label for="returnRemarks">
          Remarks
          <span class="optional">
            Optional
          </span>
        </label>

        <textarea
          id="returnRemarks"
          rows="3"
          placeholder="Enter remarks if needed..."></textarea>

      </div>


      <!-- =========================================
           HIDDEN SYSTEM VALUES
           ========================================= -->

      <!--
        These values are still used by JavaScript
        and the backend, but they are no longer
        displayed to the IT staff.
      -->

      <input
        type="hidden"
        id="returnHeadsetBrand">

      <input
        type="hidden"
        id="returnCurrentStatus">

      <input
        type="hidden"
        id="returnCheckedBy">

    </div>


    <!-- =========================================
         FOOTER
         ========================================= -->

    <div class="modal-footer">

      <button
        type="button"
        class="btn-secondary"
        onclick="closeReturnHeadsetModal()">

        Cancel

      </button>


      <button
        type="button"
        class="btn-primary"
        id="btnReturnHeadset"
        onclick="saveReturnHeadset()">

        Return Headset

      </button>

    </div>

  </div>

</div>

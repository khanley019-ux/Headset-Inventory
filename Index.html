  <!-- =====================================================
       PUBLIC / IT LOGIN CONTROL
       ===================================================== -->

  <script>

    function openITLogin() {

      console.log("Opening IT Login");


      const loginContainer =
        document.getElementById("login-container");

      const loginButton =
        document.getElementById("itLoginButton");


      if (loginButton) {

        loginButton.style.display = "none";

      }


      if (loginContainer) {

        loginContainer.style.display = "flex";

      }


      const username =
        document.getElementById("username");


      if (username) {

        username.focus();

      }

    }


    function closeITLogin() {

      const loginContainer =
        document.getElementById("login-container");

      const loginButton =
        document.getElementById("itLoginButton");


      if (loginContainer) {

        loginContainer.style.display = "none";

      }


      if (loginButton) {

        loginButton.style.display = "block";

      }

    }

  </script>

<div id="transaction-history-page" class="page" style="display:none;">

  <div class="page-header">

    <div>
      <h1>Transaction History</h1>
      <p>View all headset movements and transactions</p>
    </div>

  </div>

  <!-- =========================================
     TRANSACTION SUMMARY CARDS
     ========================================= -->

  <div class="transaction-summary">

    <div class="transaction-stat-card">

      <div class="transaction-stat-icon">
        <span class="material-icons-outlined">
          history
        </span>
      </div>

      <div>
        <h3 id="transactionStatTotal">0</h3>
        <p>Total Transactions</p>
      </div>

    </div>


    <div class="transaction-stat-card">

      <div class="transaction-stat-icon">
        <span class="material-icons-outlined">
          assignment_ind
        </span>
      </div>

      <div>
        <h3 id="transactionStatIssued">0</h3>
        <p>Issued</p>
      </div>

    </div>


    <div class="transaction-stat-card">

      <div class="transaction-stat-icon">
        <span class="material-icons-outlined">
          headphones
        </span>
      </div>

      <div>
        <h3 id="transactionStatBorrowed">0</h3>
        <p>Borrowed</p>
      </div>

    </div>


    <div class="transaction-stat-card">

      <div class="transaction-stat-icon">
        <span class="material-icons-outlined">
          assignment_return
        </span>
      </div>

      <div>
        <h3 id="transactionStatReturned">0</h3>
        <p>Returned</p>
      </div>

    </div>

  </div>

  <!-- FILTER TOOLBAR -->

  <!-- =========================================
     TRANSACTION FILTER TOOLBAR
     ========================================= -->

  <div class="transaction-toolbar">

    <div class="transaction-search">

      <span class="material-icons-outlined">
        search
      </span>

      <input
        type="text"
        id="transactionSearch"
        placeholder="Search Asset ID, Employee, or Brand..."
        onkeyup="filterTransactions()">

    </div>


    <div class="transaction-filter">

      <span class="material-icons-outlined">
        filter_list
      </span>

      <select
        id="transactionActionFilter"
        onchange="filterTransactions()">

        <option value="all">
          All Actions
        </option>

        <option value="issued">
          Issued
        </option>

        <option value="borrowed">
          Borrowed
        </option>

        <option value="returned">
          Returned
        </option>

      </select>

    </div>

  </div>


  <!-- TRANSACTION TABLE -->

  <div class="recent-transactions-card">

    <div class="transactions-table-wrapper">

      <table class="transactions-table">

        <thead>

          <tr>

            <th>Date</th>
            <th>Action</th>
            <th>Asset ID</th>
            <th>Brand</th>
            <th>Employee</th>

          </tr>

        </thead>


        <tbody id="transactionHistoryBody">

          <tr>

            <td
              colspan="5"
              class="transactions-loading">

              Loading transaction history...

            </td>

          </tr>

        </tbody>

      </table>

      <div id="transactionPagination" class="inventory-pagination"></div>

    </div>

  </div>

</div>

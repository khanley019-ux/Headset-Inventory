<div id="inventory-page" class="page" style="display:none;">

  <!-- =========================================
       PAGE HEADER
       ========================================= -->

  <div class="page-header">

    <div>
      <h1>Inventory</h1>
      <p>Manage all headset assets</p>
    </div>

  </div>


  <!-- =========================================
       ACTION BUTTONS
       ========================================= -->

  <!-- =========================================
     INVENTORY QUICK ACTIONS
     ========================================= -->

<section class="dashboard-section inventory-quick-actions">

  <div class="quick-actions">


    <!-- ADD HEADSET -->

    <button
      type="button"
      class="quick-action-btn"
      onclick="openAddHeadsetModal()">

      <span class="material-icons-outlined">
        add_circle
      </span>

      <div>
        <strong>Add Headset</strong>
        <small>Add a new headset to inventory</small>
      </div>

    </button>


    <!-- ISSUE HEADSET -->

    <button
      type="button"
      class="quick-action-btn"
      onclick="openIssueHeadsetModal()">

      <span class="material-icons-outlined">
        assignment_ind
      </span>

      <div>
        <strong>Issue Headset</strong>
        <small>Assign a headset to an employee</small>
      </div>

    </button>


    <!-- BORROW HEADSET -->

    <button
      type="button"
      class="quick-action-btn"
      onclick="openBorrowHeadsetModal()">

      <span class="material-icons-outlined">
        headphones
      </span>

      <div>
        <strong>Borrow Headset</strong>
        <small>Record a temporary headset loan</small>
      </div>

    </button>


    <!-- RETURN HEADSET -->

    <button
      type="button"
      class="quick-action-btn"
      onclick="openReturnHeadsetModal()">

      <span class="material-icons-outlined">
        assignment_return
      </span>

      <div>
        <strong>Return Headset</strong>
        <small>Process a returned headset</small>
      </div>

    </button>


  </div>

</section>

  <!-- =========================================
       SEARCH + FILTER TOOLBAR
       ========================================= -->

  <div class="inventory-toolbar">

    <div class="inventory-search">

      <span class="material-icons-outlined">
        search
      </span>

      <input
        type="text"
        id="inventorySearch"
        placeholder="Search Asset ID, Brand, Model, or Serial Number..."
        oninput="searchInventory()">

    </div>


    <div class="inventory-filter">

      <span class="material-icons-outlined">
        filter_list
      </span>

      <select
        id="inventoryStatusFilter"
        onchange="filterInventory()">

        <option value="">All Status</option>
        <option value="Available">Available</option>
        <option value="Assigned">Assigned</option>
        <option value="Under Repair">Under Repair</option>
        <option value="Damaged">Damaged</option>
        <option value="Lost">Lost</option>
        <option value="Borrowed">Borrowed</option>

      </select>

    </div>

  </div>


  <!-- =========================================
       TABLE CARD
       ========================================= -->

  <div class="inventory-table-card">

    <div class="table-container">

      <table
        id="inventoryTable"
        class="inventory-table">

        <thead>

          <tr>

            <th>Asset ID</th>
            <th>Brand</th>
            <th>Model</th>
            <th>Serial Number</th>
            <th>Status</th>
            <th>Condition</th>
            <th>Assigned To</th>
            <th style="text-align:center;">
              Action
            </th>

          </tr>

        </thead>


        <tbody>

        </tbody>

      </table>

    </div>


    <!-- =========================================
         PAGINATION
         ========================================= -->

    <div
      id="inventoryPagination"
      class="inventory-pagination">

    </div>

  </div>

</div>

<!-- =========================================
     HEADSET DETAILS MODAL
     ========================================= -->

<div
  id="headsetDetailsModal"
  class="modal"
  style="display:none;">

  <div
    class="modal-content headset-details-modal"
    style="max-width:700px;">

    <!-- =====================================
         MODAL HEADER
         ===================================== -->

    <div class="modal-header">

      <div>
        <h2>Headset Details</h2>
        <p class="modal-subtitle">
          View complete information about this headset
        </p>
      </div>

      <button
        type="button"
        class="modal-close"
        onclick="closeHeadsetDetails()"
        aria-label="Close">

        <span class="material-icons-outlined">
          close
        </span>

      </button>

    </div>


    <!-- =====================================
         MODAL BODY
         ===================================== -->

    <div class="modal-body">


      <!-- ===================================
           HEADSET INFORMATION
           =================================== -->

      <div class="details-section">

        <h3>Headset Information</h3>

        <div class="details-grid">

          <div class="detail-item">
            <label>Asset ID</label>
            <span id="detailAssetId">-</span>
          </div>

          <div class="detail-item">
            <label>Brand</label>
            <span id="detailBrand">-</span>
          </div>

          <div class="detail-item">
            <label>Model</label>
            <span id="detailModel">-</span>
          </div>

          <div class="detail-item">
            <label>Serial Number</label>
            <span id="detailSerial">-</span>
          </div>

          <div class="detail-item">
            <label>Status</label>
            <span id="detailStatus">-</span>
          </div>

          <div class="detail-item">
            <label>Condition</label>
            <span id="detailCondition">-</span>
          </div>

        </div>

      </div>


      <!-- ===================================
           ASSIGNMENT INFORMATION
           =================================== -->

      <div class="details-section">

        <h3>Assignment Information</h3>

        <div class="details-grid">

          <div class="detail-item">
            <label>Assigned To</label>
            <span id="detailAssigned">-</span>
          </div>

          <div class="detail-item">
            <label>Last User</label>
            <span id="detailLastUser">-</span>
          </div>

          <div class="detail-item">
            <label>Date Issued</label>
            <span id="detailDateIssued">-</span>
          </div>

          <div class="detail-item">
            <label>Date Returned</label>
            <span id="detailDateReturned">-</span>
          </div>

        </div>

      </div>


      <!-- ===================================
           PURCHASE INFORMATION
           =================================== -->

      <div class="details-section">

        <h3>Purchase Information</h3>

        <div class="details-grid">

          <div class="detail-item">
            <label>Purchase Date</label>
            <span id="detailPurchaseDate">-</span>
          </div>

          <div class="detail-item">
            <label>Purchase Price</label>
            <span id="detailPurchasePrice">-</span>
          </div>

          <div class="detail-item">
            <label>Age</label>
            <span id="detailAge">-</span>
          </div>

          <div class="detail-item">
            <label>Depreciated Value</label>
            <span id="detailDepreciated">-</span>
          </div>

        </div>

      </div>

    </div>


    <!-- =====================================
         MODAL FOOTER
         ===================================== -->

    <div class="modal-footer">

      <button
        type="button"
        class="btn-primary"
        onclick="generateEAR(
          document.getElementById('detailAssetId').textContent
        )">

        <span class="material-icons-outlined">
          description
        </span>

        Generate EAR

      </button>


      <button
        type="button"
        class="btn-secondary"
        onclick="closeHeadsetDetails()">

        Close

      </button>

    </div>

  </div>

</div>

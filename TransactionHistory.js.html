<script>

let transactionHistoryData = [];

let transactionCurrentPage = 1;

const transactionRowsPerPage = 10;


/* =========================================
   LOAD TRANSACTION HISTORY PAGE
   ========================================= */

function loadTransactionHistory() {

  const dashboardPage =
    document.getElementById("dashboard-page");

  const inventoryPage =
    document.getElementById("inventory-page");

  const transactionPage =
    document.getElementById(
      "transaction-history-page"
    );

  const reportsPage =
    document.getElementById("reports-page");


  if (!transactionPage) {

    console.error(
      "Transaction History page elements not found."
    );

    return;

  }


  // Hide other pages

  if (dashboardPage) {
    dashboardPage.style.display = "none";
  }

  if (inventoryPage) {
    inventoryPage.style.display = "none";
  }

  if (transactionPage) {
    transactionPage.style.display = "block";
  }

  if (reportsPage) {
    reportsPage.style.display = "none";
  }


  // Sidebar active state

  document
    .getElementById("menuDashboard")
    ?.classList.remove("active");

  document
    .getElementById("menuInventory")
    ?.classList.remove("active");

  document
    .getElementById("menuTransactions")
    ?.classList.add("active");

  document
    .getElementById("menuReports")
    ?.classList.remove("active");


  // Load transaction history

  if (
    typeof loadTransactionHistoryData ===
    "function"
  ) {

    loadTransactionHistoryData();

  }

}

/* =========================================
   LOAD DATA
   ========================================= */

function loadTransactionHistoryData() {

  const tbody =
    document.getElementById(
      "transactionHistoryBody"
    );


  if (!tbody) {

    console.error(
      "transactionHistoryBody not found."
    );

    return;
  }


  tbody.innerHTML = `
    <tr>
      <td colspan="5" class="transactions-loading">
        Loading transaction history...
      </td>
    </tr>
  `;


  google.script.run

    .withSuccessHandler(function(transactions) {

      console.log(
        "Transaction history received:",
        transactions
      );


      transactionHistoryData =
        transactions || [];

      updateTransactionSummary();

      transactionCurrentPage = 1;


      renderTransactionHistory();


    })

    .withFailureHandler(function(error) {

      console.error(
        "Transaction history error:",
        error
      );


      transactionHistoryData = [];


      tbody.innerHTML = `
        <tr>
          <td colspan="5" class="transactions-empty">
            Unable to load transaction history.
          </td>
        </tr>
      `;


      updateTransactionPagination();

    })

    .getTransactionHistory();

}


/* =========================================
   FILTER TRANSACTIONS
   ========================================= */

function filterTransactions() {

  transactionCurrentPage = 1;

  renderTransactionHistory();

}


/* =========================================
   GET FILTERED DATA
   ========================================= */

function getFilteredTransactions() {

  const searchInput =
    document.getElementById(
      "transactionSearch"
    );


  const actionFilter =
    document.getElementById(
      "transactionActionFilter"
    );


  const searchValue =
    (
      searchInput?.value || ""
    )
      .toLowerCase()
      .trim();


  const selectedAction =
    (
      actionFilter?.value || "all"
    )
      .toLowerCase()
      .trim();


  return transactionHistoryData.filter(
    function(transaction) {


      const assetId =
        (
          transaction.assetId || ""
        )
          .toLowerCase();


      const brand =
        (
          transaction.brand || ""
        )
          .toLowerCase();


      const employee =
        (
          transaction.employee ||
          transaction.agentName ||
          ""
        )
          .toLowerCase();


      const action =
        (
          transaction.action ||
          transaction.type ||
          ""
        )
          .toLowerCase();


      const matchesSearch =

        !searchValue ||

        assetId.includes(searchValue) ||

        brand.includes(searchValue) ||

        employee.includes(searchValue);


      const matchesAction =

        selectedAction === "all" ||

        action === selectedAction;


      return (
        matchesSearch &&
        matchesAction
      );

    }
  );

}


/* =========================================
   RENDER TRANSACTION HISTORY
   ========================================= */

function renderTransactionHistory() {

  const tbody =
    document.getElementById(
      "transactionHistoryBody"
    );


  if (!tbody) {
    return;
  }


  const filteredTransactions =
    getFilteredTransactions();


  const totalRows =
    filteredTransactions.length;


  const totalPages =
    Math.max(
      1,
      Math.ceil(
        totalRows /
        transactionRowsPerPage
      )
    );


  if (
    transactionCurrentPage >
    totalPages
  ) {

    transactionCurrentPage =
      totalPages;

  }


  if (
    transactionCurrentPage < 1
  ) {

    transactionCurrentPage = 1;

  }


  if (totalRows === 0) {

    tbody.innerHTML = `
      <tr>
        <td
          colspan="5"
          class="transactions-empty">

          No transaction history found.

        </td>
      </tr>
    `;


    updateTransactionPagination();

    return;

  }


  const startIndex =
    (
      transactionCurrentPage - 1
    ) *
    transactionRowsPerPage;


  const endIndex =
    startIndex +
    transactionRowsPerPage;


  const pageTransactions =
    filteredTransactions.slice(
      startIndex,
      endIndex
    );


  tbody.innerHTML = "";


  pageTransactions.forEach(
    function(transaction) {


      let actionClass =
        "transaction-action";


      const action =
        (
          transaction.action ||
          transaction.type ||
          ""
        )
          .toLowerCase();


      if (action === "issued") {

        actionClass +=
          " transaction-issued";

      }
      else if (
        action === "borrowed"
      ) {

        actionClass +=
          " transaction-borrowed";

      }
      else if (
        action === "returned"
      ) {

        actionClass +=
          " transaction-returned";

      }


      let formattedDate = "-";


      if (transaction.date) {

        const date =
          new Date(
            transaction.date
          );


        if (
          !isNaN(
            date.getTime()
          )
        ) {

          formattedDate =
            date.toLocaleDateString(
              "en-US",
              {
                month: "2-digit",
                day: "2-digit",
                year: "numeric"
              }
            );

        }

      }


      const employee =
        transaction.employee ||
        transaction.agentName ||
        "-";


      const actionText =
        transaction.action ||
        transaction.type ||
        "-";


      tbody.innerHTML += `

        <tr>

          <td>
            ${formattedDate}
          </td>

          <td>

            <span
              class="${actionClass}">

              ${actionText}

            </span>

          </td>

          <td>

            <strong>
              ${transaction.assetId || "-"}
            </strong>

          </td>

          <td>
            ${transaction.brand || "-"}
          </td>

          <td>
            ${employee}
          </td>

        </tr>

      `;

    }
  );


  updateTransactionPagination(
    transactionCurrentPage,
    totalPages,
    totalRows
  );

}


/* =========================================
   PAGINATION UI
   ========================================= */

function updateTransactionPagination(
  currentPage,
  totalPages,
  totalRows
) {

  const pagination =
    document.getElementById("transactionPagination");

  if (!pagination) {
    return;
  }

  const start =
    totalRows === 0
      ? 0
      : ((currentPage - 1) * transactionRowsPerPage) + 1;

  const end =
    Math.min(
      currentPage * transactionRowsPerPage,
      totalRows
    );

  pagination.innerHTML = `

    <div class="pagination-info">

      Showing ${start} - ${end}
      of ${totalRows}

    </div>


    <div class="pagination-controls">

      <button
        type="button"
        class="pagination-btn"
        onclick="changeTransactionPage(-1)"
        ${currentPage <= 1 ? "disabled" : ""}>

        <span class="material-icons-outlined">
          chevron_left
        </span>

        Previous

      </button>


      <span class="pagination-page">

        Page ${currentPage} of ${totalPages}

      </span>


      <button
        type="button"
        class="pagination-btn"
        onclick="changeTransactionPage(1)"
        ${currentPage >= totalPages ? "disabled" : ""}>

        Next

        <span class="material-icons-outlined">
          chevron_right
        </span>

      </button>

    </div>

  `;
}


/* =========================================
   CHANGE PAGE
   ========================================= */

function changeTransactionPage(
  direction
) {

  transactionCurrentPage +=
    direction;


  renderTransactionHistory();

}


/* =========================================
   RESET PAGINATION
   ========================================= */

function resetTransactionPagination() {

  transactionCurrentPage = 1;

  renderTransactionHistory();

}

/* =========================================
   TRANSACTION SUMMARY
   ========================================= */

function updateTransactionSummary() {

  const transactions =
    transactionHistoryData || [];


  let issued = 0;
  let borrowed = 0;
  let returned = 0;


  transactions.forEach(function(transaction) {

    const action =
      (
        transaction.action ||
        transaction.type ||
        ""
      )
        .toLowerCase()
        .trim();


    if (action === "issued") {

      issued++;

    }
    else if (action === "borrowed") {

      borrowed++;

    }
    else if (action === "returned") {

      returned++;

    }

  });


  const total =
    transactions.length;


  const totalElement =
    document.getElementById(
      "transactionStatTotal"
    );


  const issuedElement =
    document.getElementById(
      "transactionStatIssued"
    );


  const borrowedElement =
    document.getElementById(
      "transactionStatBorrowed"
    );


  const returnedElement =
    document.getElementById(
      "transactionStatReturned"
    );


  if (totalElement) {

    totalElement.textContent =
      total;

  }


  if (issuedElement) {

    issuedElement.textContent =
      issued;

  }


  if (borrowedElement) {

    borrowedElement.textContent =
      borrowed;

  }


  if (returnedElement) {

    returnedElement.textContent =
      returned;

  }

}

</script>
